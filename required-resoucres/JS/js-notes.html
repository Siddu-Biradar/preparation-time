}

  content: '';

  height: 8px;
  border-radius: 50%;

// ===== NOTES SYSTEM =====
const NOTES_PREFIX = 'js-notes-';
const NOTES_API = 'http://localhost:5502/api/notes';
let serverAvailable = false;
let fileNotes = {};
const dirtyEditors = new Set();

// Generate unique slug: phase1-history
function slug(phaseNum, sectionId) {
  return `phase${phaseNum}-${sectionId}`;
}

// Check server
async function checkServer() {
  try {
    const res = await fetch(NOTES_API, { method: 'GET', signal: AbortSignal.timeout(1000) });
    if (res.ok) {
      serverAvailable = true;
      fileNotes = await res.json();
      document.getElementById('server-status').className = 'server-status connected';
      document.getElementById('server-status').textContent = 'Server connected';
      return true;
    }
  } catch(e) {}
  serverAvailable = false;
  document.getElementById('server-status').className = 'server-status disconnected';
  document.getElementById('server-status').textContent = 'localStorage only';
  return false;
}

// Save to server
async function saveToServer(noteSlug, content) {
  if (!serverAvailable) return;
  try {
    await fetch(NOTES_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: noteSlug, content })
    });
  } catch(e) {}
}

// Delete from server
async function deleteFromServer(noteSlug) {
  if (!serverAvailable) return;
  try {
    await fetch(NOTES_API + '/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: noteSlug })
    });
  } catch(e) {}
}

// Get note content (server > localStorage)
function getNoteContent(noteSlug) {
  return fileNotes[noteSlug] || localStorage.getItem(NOTES_PREFIX + noteSlug) || '';
}

// Toggle notes panel
function toggleNotes(noteSlug) {
  const area = document.getElementById('notes-' + noteSlug);
  const btn = document.querySelector(`[data-slug="${noteSlug}"]`);
  const editor = document.getElementById('editor-' + noteSlug);

  if (area.classList.contains('open')) {
    if (dirtyEditors.has(noteSlug)) saveNotesQuiet(noteSlug);
    area.classList.remove('open');
    btn.classList.remove('active');
  } else {
    area.classList.add('open');
    btn.classList.add('active');
    const saved = getNoteContent(noteSlug);
    if (saved && !editor.innerHTML.trim()) editor.innerHTML = saved;
    editor.focus();
  }
}

// Quiet save
function saveNotesQuiet(noteSlug) {
  const editor = document.getElementById('editor-' + noteSlug);
  if (!editor) return;
  const content = editor.innerHTML;
  if (content && content.trim() && content !== '<br>') {
    localStorage.setItem(NOTES_PREFIX + noteSlug, content);
    if (dirtyEditors.has(noteSlug)) saveToServer(noteSlug, content);
  }
  dirtyEditors.delete(noteSlug);
}

// Explicit save with UI feedback
function saveNotes(noteSlug) {
  const editor = document.getElementById('editor-' + noteSlug);
  const statusEl = document.getElementById('status-' + noteSlug);
  const content = editor.innerHTML;
  localStorage.setItem(NOTES_PREFIX + noteSlug, content);
  saveToServer(noteSlug, content);
  dirtyEditors.delete(noteSlug);
  statusEl.textContent = '✓ Saved!';
  statusEl.style.color = 'var(--success)';
  setTimeout(() => { statusEl.textContent = ''; }, 2000);
  updateStats();
  updateNoteIndicator(noteSlug);
}

// Clear notes
function clearNotes(noteSlug) {
  if (!confirm('Clear notes for this section?')) return;
  const editor = document.getElementById('editor-' + noteSlug);
  editor.innerHTML = '';
  localStorage.removeItem(NOTES_PREFIX + noteSlug);
  delete fileNotes[noteSlug];
  deleteFromServer(noteSlug);
  dirtyEditors.delete(noteSlug);
  const statusEl = document.getElementById('status-' + noteSlug);
  statusEl.textContent = '🗑️ Cleared';
  statusEl.style.color = 'var(--danger)';
  setTimeout(() => { statusEl.textContent = ''; }, 2000);
  updateStats();
  updateNoteIndicator(noteSlug);
}

// Auto-save
const autoSaveTimers = {};
function autoSaveNotes(noteSlug) {
  dirtyEditors.add(noteSlug);
  clearTimeout(autoSaveTimers[noteSlug]);
  const statusEl = document.getElementById('status-' + noteSlug);
  statusEl.textContent = 'typing...';
  statusEl.style.color = 'var(--muted)';
  autoSaveTimers[noteSlug] = setTimeout(() => {
    saveNotes(noteSlug);
  }, 800);
}

// Save all dirty on page close
function saveAllDirty() {
  if (dirtyEditors.size === 0) return;
  const dirtyNotes = {};
  dirtyEditors.forEach(noteSlug => {
    const editor = document.getElementById('editor-' + noteSlug);
    if (editor) {
      const content = editor.innerHTML;
      if (content && content.trim() && content !== '<br>') {
        localStorage.setItem(NOTES_PREFIX + noteSlug, content);
        dirtyNotes[noteSlug] = content;
      }
    }
  });
  if (serverAvailable && Object.keys(dirtyNotes).length > 0) {
    const blob = new Blob([JSON.stringify(dirtyNotes)], { type: 'application/json' });
    navigator.sendBeacon(NOTES_API + '/bulk', blob);
  }
  dirtyEditors.clear();
}

// Rich text
function formatText(command) {
  document.execCommand(command, false, null);
}
function applyColor(noteSlug, color) {
  const editor = document.getElementById('editor-' + noteSlug);
  editor.focus();
  document.execCommand('foreColor', false, color);
  dirtyEditors.add(noteSlug);
  setTimeout(() => saveNotesQuiet(noteSlug), 100);
}
function applyHighlight(noteSlug, color) {
  const editor = document.getElementById('editor-' + noteSlug);
  editor.focus();
  document.execCommand('hiliteColor', false, color);
  dirtyEditors.add(noteSlug);
  setTimeout(() => saveNotesQuiet(noteSlug), 100);
}
function removeFormat(noteSlug) {
  const editor = document.getElementById('editor-' + noteSlug);
  editor.focus();
  document.execCommand('removeFormat', false, null);
  dirtyEditors.add(noteSlug);
  setTimeout(() => saveNotesQuiet(noteSlug), 100);
}

// Update note indicator on button
function updateNoteIndicator(noteSlug) {
  const btn = document.querySelector(`[data-slug="${noteSlug}"]`);
  if (!btn) return;
  const content = getNoteContent(noteSlug);
  if (content && content.trim() && content !== '<br>') {
    btn.classList.add('has-notes');
  } else {
    btn.classList.remove('has-notes');
  }
}

// Update stats
function updateStats() {
  let totalSections = 0;
  let notesWritten = 0;
  PHASES.forEach(phase => {
    phase.sections.forEach(sec => {
      totalSections++;
      const s = slug(phase.num, sec.id);
      const content = getNoteContent(s);
      if (content && content.trim() && content !== '<br>') notesWritten++;
    });
  });
  document.getElementById('stat-sections').textContent = totalSections + ' Sections';
  document.getElementById('stat-notes').textContent = notesWritten + ' Notes Written';
  const pct = totalSections > 0 ? Math.round((notesWritten / totalSections) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// Toggle phase open/close
function togglePhase(phaseNum) {
  const card = document.getElementById('phase-card-' + phaseNum);
  card.classList.toggle('open');
}

// ===== RENDER =====
function render() {
  const container = document.getElementById('phases-container');
  let html = '';

  PHASES.forEach(phase => {
    html += `<div class="phase-card" id="phase-card-${phase.num}">`;
    html += `<div class="phase-header" onclick="togglePhase(${phase.num})">`;
    html += `<span class="phase-num">Phase ${phase.num}</span>`;
    html += `<span class="phase-title">${phase.title}</span>`;
    html += `<span class="phase-count">${phase.sections.length} sections</span>`;
    html += `<span class="chevron">▶</span>`;
    html += `</div>`;
    html += `<div class="phase-body">`;

    phase.sections.forEach((sec, idx) => {
      const s = slug(phase.num, sec.id);
      html += `<div class="section-item">`;
      html += `<div class="section-header">`;
      html += `<span class="sec-num">${idx + 1}</span>`;
      html += `<span class="sec-title">${sec.title}</span>`;
      html += `<a class="sec-link" href="${phase.file}#${sec.id}" target="_blank">Open →</a>`;
      html += `<button class="btn-notes-toggle" data-slug="${s}" onclick="toggleNotes('${s}')">📝 Notes</button>`;
      html += `</div>`;
      // Notes area
      html += `<div class="notes-area" id="notes-${s}">`;
      // Toolbar
      html += `<div class="notes-toolbar">`;
      html += `<button onclick="formatText('bold')" title="Bold"><b>B</b></button>`;
      html += `<button onclick="formatText('italic')" title="Italic"><i>I</i></button>`;
      html += `<button onclick="formatText('underline')" title="Underline"><u>U</u></button>`;
      html += `<span class="separator"></span>`;
      html += `<label>Text:</label>`;
      html += `<button class="color-btn" style="background:#e74c3c" onclick="applyColor('${s}','#e74c3c')" title="Red"></button>`;
      html += `<button class="color-btn" style="background:#27ae60" onclick="applyColor('${s}','#27ae60')" title="Green"></button>`;
      html += `<button class="color-btn" style="background:#2980b9" onclick="applyColor('${s}','#2980b9')" title="Blue"></button>`;
      html += `<button class="color-btn" style="background:#8e44ad" onclick="applyColor('${s}','#8e44ad')" title="Purple"></button>`;
      html += `<span class="separator"></span>`;
      html += `<label>Highlight:</label>`;
      html += `<button class="color-btn" style="background:#fff176" onclick="applyHighlight('${s}','#fff176')" title="Yellow"></button>`;
      html += `<button class="color-btn" style="background:#aed581" onclick="applyHighlight('${s}','#aed581')" title="Green"></button>`;
      html += `<button class="color-btn" style="background:#81d4fa" onclick="applyHighlight('${s}','#81d4fa')" title="Blue"></button>`;
      html += `<span class="separator"></span>`;
      html += `<button onclick="removeFormat('${s}')" title="Remove formatting">✖</button>`;
      html += `</div>`;
      // Editor
      html += `<div class="notes-editor" id="editor-${s}" contenteditable="true" data-placeholder="Add your notes for: ${sec.title}..." oninput="autoSaveNotes('${s}')"></div>`;
      // Footer
      html += `<div class="notes-footer">`;
      html += `<span class="save-status" id="status-${s}"></span>`;
      html += `<button class="btn-save" onclick="saveNotes('${s}')">💾 Save</button>`;
      html += `<button class="btn-clear" onclick="clearNotes('${s}')">🗑️ Clear</button>`;
      html += `</div>`;
      html += `</div>`; // notes-area
      html += `</div>`; // section-item
    });

    html += `</div>`; // phase-body
    html += `</div>`; // phase-card
  });

  container.innerHTML = html;
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', async () => {
  render();
  await checkServer();

  // Load saved notes into editors and mark buttons
  PHASES.forEach(phase => {
    phase.sections.forEach(sec => {
      const s = slug(phase.num, sec.id);
      const content = getNoteContent(s);
      if (content) {
        const editor = document.getElementById('editor-' + s);
        if (editor) editor.innerHTML = content;
        updateNoteIndicator(s);
      }
    });
  });

  updateStats();

  // Open Phase 1 by default
  togglePhase(1);
});

// Save on close
window.addEventListener('beforeunload', () => saveAllDirty());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveAllDirty();
});
window.addEventListener('pagehide', () => saveAllDirty());
</script>

<script src="nav.js"></script>
</body>
</html>
