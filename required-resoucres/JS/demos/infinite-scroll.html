<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Scroll</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; }

    .feed { max-width: 600px; margin: 0 auto; padding: 20px; }
    .feed h1 { text-align: center; margin-bottom: 20px; color: #333; }

    .post-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      animation: fadeIn 0.3s ease;
    }
    .post-card h3 { margin-bottom: 8px; color: #1a1a1a; font-size: 16px; }
    .post-card p { color: #555; line-height: 1.5; font-size: 14px; }
    .post-card .meta { 
      font-size: 12px; color: #999; margin-top: 10px; 
      display: flex; justify-content: space-between; 
    }
    .post-card .tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      background: #e8f4fd; color: #1a5276; font-size: 11px; font-weight: 600;
    }

    .loader {
      text-align: center;
      padding: 24px;
      color: #666;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #eee;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    .end-message {
      text-align: center;
      padding: 24px;
      color: #999;
      font-style: italic;
      font-size: 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="feed">
  <h1>📱 News Feed (Infinite Scroll)</h1>
  <div id="posts-container"></div>
  <div id="loader" class="loader" style="display:none">
    <div class="spinner"></div>
    <p>Loading more posts...</p>
  </div>
  <div id="end-message" class="end-message" style="display:none">
    You've reached the end! 🎉 No more posts to load.
  </div>
  <div id="sentinel"></div>
</div>

<script>
// Simulated API
function fakeFetch(page, limit = 10) {
  return new Promise((resolve) => {
    const delay = 600 + Math.random() * 600;
    setTimeout(() => {
      const totalPosts = 45;
      const start = (page - 1) * limit;
      const tags = ['Tech', 'Design', 'Business', 'Science', 'Health', 'Culture'];
      const titles = [
        'Breaking: Major Update Released',
        'How to Build Scalable Systems',
        'The Future of AI in Frontend',
        'Understanding React Internals',
        'CSS Grid vs Flexbox in 2025',
        'Why TypeScript Wins',
        'Performance Optimization Tips',
        'Building Design Systems',
        'State Management Patterns',
        'Accessibility Best Practices'
      ];
      
      const posts = Array.from({ length: Math.min(limit, totalPosts - start) }, (_, i) => ({
        id: start + i + 1,
        title: titles[(start + i) % titles.length],
        body: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam.',
        tag: tags[Math.floor(Math.random() * tags.length)],
        date: new Date(Date.now() - (start + i) * 7200000).toLocaleDateString(),
        likes: Math.floor(Math.random() * 200)
      }));
      
      resolve({ posts, hasMore: start + limit < totalPosts, total: totalPosts });
    }, delay);
  });
}

class InfiniteScroll {
  constructor() {
    this.container = document.getElementById('posts-container');
    this.loader = document.getElementById('loader');
    this.endMessage = document.getElementById('end-message');
    this.sentinel = document.getElementById('sentinel');
    
    this.page = 1;
    this.isLoading = false;
    this.hasMore = true;
    
    this.setupObserver();
    this.loadMore();
  }

  setupObserver() {
    this.observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !this.isLoading && this.hasMore) {
        this.loadMore();
      }
    }, { rootMargin: '200px' });
    
    this.observer.observe(this.sentinel);
  }

  async loadMore() {
    if (this.isLoading || !this.hasMore) return;
    this.isLoading = true;
    this.loader.style.display = 'block';

    try {
      const { posts, hasMore } = await fakeFetch(this.page);
      
      const fragment = document.createDocumentFragment();
      posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <h3>${post.title}</h3>
          <p>${post.body}</p>
          <div class="meta">
            <span class="tag">${post.tag}</span>
            <span>${post.date} · ❤️ ${post.likes}</span>
          </div>
        `;
        fragment.appendChild(card);
      });
      this.container.appendChild(fragment);

      this.hasMore = hasMore;
      this.page++;

      if (!hasMore) {
        this.endMessage.style.display = 'block';
        this.observer.disconnect();
      }
    } catch (err) {
      console.error('Load failed:', err);
    } finally {
      this.isLoading = false;
      this.loader.style.display = 'none';
    }
  }
}

new InfiniteScroll();
</script>
</body>
</html>
