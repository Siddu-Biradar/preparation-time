<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocomplete Component</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; padding: 40px; background: #f0f2f5; }

    .search-wrapper {
      max-width: 500px;
      margin: 0 auto;
    }
    .search-wrapper h2 { margin-bottom: 16px; text-align: center; }

    .autocomplete {
      position: relative;
    }
    .autocomplete input {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .autocomplete input:focus { 
      border-color: #4a90d9; 
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
      list-style: none;
    }
    .autocomplete-dropdown.open { display: block; }

    .autocomplete-dropdown li {
      padding: 12px 18px;
      cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
      transition: background 0.1s;
      font-size: 15px;
    }
    .autocomplete-dropdown li:last-child { border-bottom: none; }
    .autocomplete-dropdown li:hover,
    .autocomplete-dropdown li.active { background: #e8f4fd; }
    .autocomplete-dropdown li strong { color: #1a5276; }

    .no-results { padding: 14px 18px; color: #999; font-style: italic; }

    .hint { text-align: center; margin-top: 12px; color: #888; font-size: 13px; }
  </style>
</head>
<body>

<div class="search-wrapper">
  <h2>🔍 Search Countries</h2>
  <div class="autocomplete">
    <input 
      type="text" 
      id="search-input" 
      placeholder="Type to search... (e.g. 'ind', 'uni')"
      role="combobox"
      aria-autocomplete="list"
      aria-expanded="false"
      aria-controls="suggestions-list"
      autocomplete="off"
    >
    <ul class="autocomplete-dropdown" id="suggestions-list" role="listbox"></ul>
  </div>
  <p class="hint">Try: "ind" → India, Indonesia | "uni" → United Kingdom, United States</p>
</div>

<script>
const countries = [
  'Afghanistan','Albania','Algeria','Argentina','Australia','Austria',
  'Bangladesh','Belgium','Brazil','Canada','Chile','China','Colombia',
  'Denmark','Egypt','Finland','France','Germany','Greece','India',
  'Indonesia','Ireland','Italy','Japan','Kenya','Malaysia','Mexico',
  'Netherlands','New Zealand','Nigeria','Norway','Pakistan','Peru',
  'Philippines','Poland','Portugal','Russia','Saudi Arabia','Singapore',
  'South Africa','South Korea','Spain','Sweden','Switzerland','Thailand',
  'Turkey','Ukraine','United Kingdom','United States','Vietnam'
];

class Autocomplete {
  constructor(input, dropdown, options = {}) {
    this.input = input;
    this.dropdown = dropdown;
    this.data = options.data || [];
    this.onSelect = options.onSelect || (() => {});
    this.minChars = options.minChars || 1;
    this.debounceMs = options.debounceMs || 200;
    
    this.activeIndex = -1;
    this.results = [];
    this.isOpen = false;
    this.timer = null;
    
    this.bindEvents();
  }

  bindEvents() {
    this.input.addEventListener('input', () => {
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.search(), this.debounceMs);
    });
    this.input.addEventListener('keydown', (e) => this.handleKeydown(e));
    this.input.addEventListener('focus', () => {
      if (this.results.length && this.input.value.length >= this.minChars) this.open();
    });
    document.addEventListener('click', (e) => {
      if (!this.input.parentElement.contains(e.target)) this.close();
    });
  }

  search() {
    const query = this.input.value.trim().toLowerCase();
    if (query.length < this.minChars) { this.close(); return; }
    
    this.results = this.data
      .filter(item => item.toLowerCase().includes(query))
      .sort((a, b) => {
        const aStarts = a.toLowerCase().startsWith(query) ? 0 : 1;
        const bStarts = b.toLowerCase().startsWith(query) ? 0 : 1;
        return aStarts - bStarts || a.localeCompare(b);
      })
      .slice(0, 10);
    
    this.renderResults(query);
  }

  renderResults(query) {
    this.activeIndex = -1;
    
    if (this.results.length === 0) {
      this.dropdown.innerHTML = '<li class="no-results">No results found</li>';
    } else {
      this.dropdown.innerHTML = this.results.map((item, i) => {
        const highlighted = this.highlight(item, query);
        return `<li role="option" data-index="${i}" id="option-${i}">${highlighted}</li>`;
      }).join('');
      
      this.dropdown.querySelectorAll('li[data-index]').forEach(li => {
        li.addEventListener('click', () => this.select(parseInt(li.dataset.index)));
        li.addEventListener('mouseenter', () => this.setActive(parseInt(li.dataset.index)));
      });
    }
    this.open();
  }

  highlight(text, query) {
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${escaped})`, 'gi'), '<strong>$1</strong>');
  }

  handleKeydown(e) {
    if (!this.isOpen && e.key === 'ArrowDown') { this.search(); return; }
    if (!this.isOpen) return;

    switch (e.key) {
      case 'ArrowDown':
        e.preventDefault();
        this.setActive(this.activeIndex < this.results.length - 1 ? this.activeIndex + 1 : 0);
        break;
      case 'ArrowUp':
        e.preventDefault();
        this.setActive(this.activeIndex > 0 ? this.activeIndex - 1 : this.results.length - 1);
        break;
      case 'Enter':
        e.preventDefault();
        if (this.activeIndex >= 0) this.select(this.activeIndex);
        break;
      case 'Escape':
        this.close();
        break;
    }
  }

  setActive(index) {
    this.dropdown.querySelectorAll('li').forEach(li => li.classList.remove('active'));
    this.activeIndex = index;
    const active = this.dropdown.querySelector(`[data-index="${index}"]`);
    if (active) {
      active.classList.add('active');
      active.scrollIntoView({ block: 'nearest' });
      this.input.setAttribute('aria-activedescendant', `option-${index}`);
    }
  }

  select(index) {
    const value = this.results[index];
    this.input.value = value;
    this.close();
    this.onSelect(value);
  }

  open() {
    this.isOpen = true;
    this.dropdown.classList.add('open');
    this.input.setAttribute('aria-expanded', 'true');
  }

  close() {
    this.isOpen = false;
    this.dropdown.classList.remove('open');
    this.input.setAttribute('aria-expanded', 'false');
    this.activeIndex = -1;
  }
}

new Autocomplete(
  document.getElementById('search-input'),
  document.getElementById('suggestions-list'),
  {
    data: countries,
    minChars: 1,
    debounceMs: 150,
    onSelect: (val) => alert(`Selected: ${val}`)
  }
);
</script>
</body>
</html>
