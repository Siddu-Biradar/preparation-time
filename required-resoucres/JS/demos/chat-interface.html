<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Interface Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f0f0; padding: 0; }
    .chat { height: 100vh; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; background: #e5ddd5; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='%23ddd8d0' fill-opacity='.3'/%3E%3C/svg%3E"); }
    .chat-header { background: #075e54; color: white; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
    .chat-header .avatar { width: 36px; height: 36px; border-radius: 50%; background: #128c7e; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .chat-header .name { font-weight: 600; font-size: 15px; }
    .chat-header .status { font-size: 11px; opacity: 0.8; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
    .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; }
    .message.mine { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 0; }
    .message.theirs { align-self: flex-start; background: white; border-top-left-radius: 0; }
    .msg-name { font-size: 11px; font-weight: 600; color: #075e54; display: block; margin-bottom: 2px; }
    .msg-time { font-size: 10px; color: #999; float: right; margin-left: 8px; margin-top: 4px; }
    .msg-avatar { font-size: 12px; margin-right: 4px; }
    .chat-input { display: flex; gap: 8px; padding: 10px 12px; background: #f0f0f0; }
    .chat-input input { flex: 1; padding: 10px 16px; border-radius: 20px; border: none; font-size: 14px; outline: none; }
    .chat-input button { width: 40px; height: 40px; border-radius: 50%; background: #075e54; color: white; border: none; cursor: pointer; font-size: 18px; }
    .chat-input button:hover { background: #128c7e; }
    .typing-indicator { align-self: flex-start; background: white; padding: 12px 16px; border-radius: 8px; display: flex; gap: 4px; }
    .typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: #999; animation: typing 1.4s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  </style>
</head>
<body>
  <div class="chat">
    <div class="chat-header">
      <div class="avatar">👤</div>
      <div><div class="name">Interview Bot</div><div class="status">online</div></div>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
      <button id="send-btn">➤</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    const botResponses = [
      "That's a great point! Can you elaborate?",
      "Interesting approach. Have you considered edge cases?",
      "Nice! What's the time complexity of that solution?",
      "Good thinking. How would you handle errors here?",
      "Makes sense. Would this scale to 1M users?",
      "I like that! What design pattern are you using?",
      "Solid answer. Any trade-offs to consider?",
    ];

    function addMessage(text, isMine, name = 'Bot') {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = `message ${isMine ? 'mine' : 'theirs'}`;
      div.innerHTML = `${!isMine ? `<span class="msg-name">${name}</span>` : ''}<span>${escapeHtml(text)}</span><span class="msg-time">${time}${isMine ? ' ✓✓' : ''}</span>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing-indicator';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function send() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, true);
      input.value = '';

      // Bot responds after a delay
      showTyping();
      setTimeout(() => {
        hideTyping();
        const response = botResponses[Math.floor(Math.random() * botResponses.length)];
        addMessage(response, false, 'Interview Bot');
      }, 1000 + Math.random() * 1500);
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

    // Initial messages
    setTimeout(() => addMessage("Hi! 👋 I'm your interview practice bot. Send me your answers and I'll give feedback!", false, 'Interview Bot'), 500);
    setTimeout(() => addMessage("Try explaining a concept like closures, event loop, or your project architecture.", false, 'Interview Bot'), 1500);
  </script>
</body>
</html>
