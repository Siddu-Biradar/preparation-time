<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer & Stopwatch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; padding: 40px; background: #1a1a2e; color: #eee; min-height: 100vh; }

    .container { max-width: 500px; margin: 0 auto; }
    .container h1 { text-align: center; margin-bottom: 24px; font-size: 24px; }

    /* Mode Toggle */
    .mode-toggle {
      display: flex; justify-content: center; gap: 0; margin-bottom: 24px;
    }
    .mode-btn {
      padding: 10px 28px; border: 2px solid #4a90d9; background: transparent;
      color: #4a90d9; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; margin: 0;
    }
    .mode-btn:first-child { border-radius: 8px 0 0 8px; }
    .mode-btn:last-child { border-radius: 0 8px 8px 0; }
    .mode-btn.active { background: #4a90d9; color: white; }

    /* Display */
    .timer-card {
      background: #16213e;
      border-radius: 16px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .time-display {
      font-size: 64px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      margin-bottom: 8px;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .ms-display {
      font-size: 24px;
      color: #888;
      margin-bottom: 24px;
      font-family: 'SF Mono', Consolas, monospace;
    }

    /* Controls */
    .controls { display: flex; justify-content: center; gap: 12px; margin-top: 24px; }
    .ctrl-btn {
      width: 56px; height: 56px; border-radius: 50%;
      border: none; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s, box-shadow 0.2s;
      margin: 0;
    }
    .ctrl-btn:active { transform: scale(0.9); }
    .btn-start { background: #27ae60; color: white; box-shadow: 0 4px 15px rgba(39,174,96,0.3); }
    .btn-pause { background: #f39c12; color: white; box-shadow: 0 4px 15px rgba(243,156,18,0.3); }
    .btn-reset { background: #e74c3c; color: white; box-shadow: 0 4px 15px rgba(231,76,60,0.3); }
    .btn-lap { background: #9b59b6; color: white; box-shadow: 0 4px 15px rgba(155,89,182,0.3); }

    /* Countdown Input */
    .countdown-input {
      display: flex; gap: 8px; justify-content: center; margin-bottom: 20px;
    }
    .countdown-input input {
      width: 70px; padding: 10px; text-align: center;
      font-size: 18px; background: #0f3460; border: 1px solid #4a90d9;
      border-radius: 8px; color: white; font-family: monospace;
    }
    .countdown-input label {
      font-size: 11px; color: #888; display: block; margin-top: 4px; text-align: center;
    }

    /* Laps */
    .laps {
      margin-top: 24px;
      max-height: 200px;
      overflow-y: auto;
    }
    .lap-item {
      display: flex; justify-content: space-between;
      padding: 8px 14px; margin: 4px 0; background: #0f3460;
      border-radius: 6px; font-size: 13px; font-family: monospace;
    }
    .lap-item.best { color: #27ae60; }
    .lap-item.worst { color: #e74c3c; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>⏱️ Timer & Stopwatch</h1>

  <div class="mode-toggle">
    <button class="mode-btn active" onclick="switchMode('stopwatch')">Stopwatch</button>
    <button class="mode-btn" onclick="switchMode('countdown')">Countdown</button>
  </div>

  <div class="timer-card">
    <!-- Countdown Input -->
    <div class="countdown-input hidden" id="countdown-input">
      <div><input type="number" id="hours" value="0" min="0" max="99"><label>HRS</label></div>
      <div><input type="number" id="minutes" value="5" min="0" max="59"><label>MIN</label></div>
      <div><input type="number" id="seconds" value="0" min="0" max="59"><label>SEC</label></div>
    </div>

    <div class="time-display" id="time-display">00:00:00</div>
    <div class="ms-display" id="ms-display">.000</div>

    <div class="controls">
      <button class="ctrl-btn btn-start" id="btn-start" onclick="start()" title="Start">▶</button>
      <button class="ctrl-btn btn-pause hidden" id="btn-pause" onclick="pause()" title="Pause">⏸</button>
      <button class="ctrl-btn btn-lap" id="btn-lap" onclick="lap()" title="Lap" style="display:none">🏁</button>
      <button class="ctrl-btn btn-reset" id="btn-reset" onclick="reset()" title="Reset">⏹</button>
    </div>

    <div class="laps" id="laps-container"></div>
  </div>
</div>

<script>
let mode = 'stopwatch';
let running = false;
let elapsed = 0;
let targetMs = 0;
let startTime = 0;
let rafId = null;
let laps = [];

const display = document.getElementById('time-display');
const msDisplay = document.getElementById('ms-display');
const btnStart = document.getElementById('btn-start');
const btnPause = document.getElementById('btn-pause');
const btnLap = document.getElementById('btn-lap');
const btnReset = document.getElementById('btn-reset');
const lapsContainer = document.getElementById('laps-container');
const countdownInput = document.getElementById('countdown-input');

function switchMode(newMode) {
  reset();
  mode = newMode;
  document.querySelectorAll('.mode-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && mode === 'stopwatch') || (i === 1 && mode === 'countdown'));
  });
  countdownInput.classList.toggle('hidden', mode !== 'countdown');
  btnLap.style.display = mode === 'stopwatch' ? '' : 'none';
}

function formatTime(ms) {
  const totalSec = Math.floor(Math.abs(ms) / 1000);
  const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  const s = String(totalSec % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}

function formatMs(ms) {
  return '.' + String(Math.abs(ms) % 1000).padStart(3, '0');
}

function tick() {
  const now = performance.now();
  const delta = now - startTime;

  if (mode === 'stopwatch') {
    const current = elapsed + delta;
    display.textContent = formatTime(current);
    msDisplay.textContent = formatMs(Math.floor(current));
  } else {
    const remaining = targetMs - (elapsed + delta);
    if (remaining <= 0) {
      display.textContent = '00:00:00';
      msDisplay.textContent = '.000';
      running = false;
      btnStart.classList.remove('hidden');
      btnPause.classList.add('hidden');
      // Flash effect
      display.style.color = '#e74c3c';
      setTimeout(() => display.style.color = '', 2000);
      alert('⏰ Time\'s up!');
      return;
    }
    display.textContent = formatTime(remaining);
    msDisplay.textContent = formatMs(Math.floor(remaining));
  }
  rafId = requestAnimationFrame(tick);
}

function start() {
  if (mode === 'countdown' && elapsed === 0) {
    const h = parseInt(document.getElementById('hours').value) || 0;
    const m = parseInt(document.getElementById('minutes').value) || 0;
    const s = parseInt(document.getElementById('seconds').value) || 0;
    targetMs = (h * 3600 + m * 60 + s) * 1000;
    if (targetMs <= 0) return;
    countdownInput.classList.add('hidden');
  }
  running = true;
  startTime = performance.now();
  btnStart.classList.add('hidden');
  btnPause.classList.remove('hidden');
  if (mode === 'stopwatch') btnLap.style.display = '';
  tick();
}

function pause() {
  if (!running) return;
  running = false;
  cancelAnimationFrame(rafId);
  elapsed += performance.now() - startTime;
  btnStart.classList.remove('hidden');
  btnPause.classList.add('hidden');
}

function reset() {
  cancelAnimationFrame(rafId);
  running = false;
  elapsed = 0;
  laps = [];
  display.textContent = '00:00:00';
  msDisplay.textContent = '.000';
  display.style.color = '';
  btnStart.classList.remove('hidden');
  btnPause.classList.add('hidden');
  lapsContainer.innerHTML = '';
  if (mode === 'countdown') countdownInput.classList.remove('hidden');
}

function lap() {
  if (!running || mode !== 'stopwatch') return;
  const current = elapsed + (performance.now() - startTime);
  const prev = laps.length ? laps[laps.length - 1].total : 0;
  laps.push({ total: current, split: current - prev });
  renderLaps();
}

function renderLaps() {
  if (!laps.length) { lapsContainer.innerHTML = ''; return; }
  
  const splits = laps.map(l => l.split);
  const bestSplit = Math.min(...splits);
  const worstSplit = Math.max(...splits);

  lapsContainer.innerHTML = [...laps].reverse().map((l, ri) => {
    const i = laps.length - 1 - ri;
    let cls = '';
    if (laps.length > 2) {
      if (l.split === bestSplit) cls = 'best';
      else if (l.split === worstSplit) cls = 'worst';
    }
    return `<div class="lap-item ${cls}">
      <span>Lap ${i + 1}</span>
      <span>${formatTime(l.split)}${formatMs(Math.floor(l.split))}</span>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
