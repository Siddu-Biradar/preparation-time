<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debounce & Throttle Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; padding: 30px; background: #f5f5f5; }

    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; font-size: 22px; }

    .demo-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .demo-card h3 { margin-bottom: 12px; color: #1a5276; font-size: 16px; }
    .demo-card p { font-size: 13px; color: #666; margin-bottom: 12px; }

    input[type="text"] {
      width: 100%; padding: 12px 16px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 15px; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4a90d9; }

    .log-area {
      margin-top: 12px; padding: 12px;
      background: #1a1a2e; border-radius: 8px;
      max-height: 160px; overflow-y: auto;
      font-family: 'SF Mono', Consolas, monospace; font-size: 12px;
      color: #00d9a3; line-height: 1.8;
    }
    .log-item { opacity: 0; animation: fadeIn 0.2s forwards; }
    .log-item.raw { color: #888; }
    .log-item.debounced { color: #27ae60; }
    .log-item.throttled { color: #f39c12; }

    .counter-row {
      display: flex; gap: 12px; margin-top: 12px; font-size: 13px; font-weight: 600;
    }
    .counter { padding: 6px 12px; border-radius: 6px; background: #f0f0f0; }
    .counter.raw { color: #e74c3c; }
    .counter.processed { color: #27ae60; }

    button.resize-btn {
      width: 100%; padding: 12px; margin-top: 10px;
      background: #4a90d9; color: white; border: none;
      border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600;
    }
    button.resize-btn:hover { background: #357abd; }
    .clear-btn {
      background: #eee; color: #555; border: none; padding: 6px 14px;
      border-radius: 6px; font-size: 12px; cursor: pointer; float: right;
      margin: 0;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <h1>⚡ Debounce vs Throttle</h1>

  <!-- Debounce Demo -->
  <div class="demo-card">
    <h3>🔍 Debounce — Search Input</h3>
    <p>Type fast — API call fires only after you <strong>stop typing</strong> for 500ms</p>
    <input type="text" id="debounce-input" placeholder="Type here... watch the log below">
    <div class="counter-row">
      <span class="counter raw">Keystrokes: <span id="debounce-raw">0</span></span>
      <span class="counter processed">API Calls: <span id="debounce-fired">0</span></span>
      <button class="clear-btn" onclick="clearLog('debounce')">Clear</button>
    </div>
    <div class="log-area" id="debounce-log"></div>
  </div>

  <!-- Throttle Demo -->
  <div class="demo-card">
    <h3>🖱️ Throttle — Scroll / Resize</h3>
    <p>Click rapidly — handler fires at most once every <strong>300ms</strong></p>
    <button class="resize-btn" id="throttle-btn">Click me rapidly! (simulates scroll/resize)</button>
    <div class="counter-row">
      <span class="counter raw">Clicks: <span id="throttle-raw">0</span></span>
      <span class="counter processed">Handler Fired: <span id="throttle-fired">0</span></span>
      <button class="clear-btn" onclick="clearLog('throttle')">Clear</button>
    </div>
    <div class="log-area" id="throttle-log"></div>
  </div>
</div>

<script>
// ━━━━━━━ DEBOUNCE IMPLEMENTATION ━━━━━━━
function debounce(fn, delay) {
  let timerId = null;
  
  function debounced(...args) {
    clearTimeout(timerId);
    timerId = setTimeout(() => {
      fn.apply(this, args);
      timerId = null;
    }, delay);
  }
  
  debounced.cancel = () => { clearTimeout(timerId); timerId = null; };
  debounced.flush = () => { if (timerId) { clearTimeout(timerId); fn(); timerId = null; } };
  return debounced;
}

// ━━━━━━━ THROTTLE IMPLEMENTATION ━━━━━━━
function throttle(fn, limit) {
  let inThrottle = false;
  let lastArgs = null;
  let lastThis = null;

  return function(...args) {
    if (!inThrottle) {
      fn.apply(this, args);
      inThrottle = true;
      setTimeout(() => {
        inThrottle = false;
        if (lastArgs) {
          fn.apply(lastThis, lastArgs);
          lastArgs = null;
          lastThis = null;
        }
      }, limit);
    } else {
      lastArgs = args;
      lastThis = this;
    }
  };
}

// ━━━━━━━ DEMO LOGIC ━━━━━━━
let debounceRaw = 0, debounceFired = 0;
let throttleRaw = 0, throttleFired = 0;

function addLog(containerId, text, type) {
  const log = document.getElementById(containerId);
  const time = new Date().toLocaleTimeString([], {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit', fractionalSecondDigits: 3});
  const item = document.createElement('div');
  item.className = `log-item ${type}`;
  item.textContent = `[${time}] ${text}`;
  log.appendChild(item);
  log.scrollTop = log.scrollHeight;
}

function clearLog(type) {
  document.getElementById(`${type}-log`).innerHTML = '';
}

// Debounce demo
const debouncedSearch = debounce((query) => {
  debounceFired++;
  document.getElementById('debounce-fired').textContent = debounceFired;
  addLog('debounce-log', `✅ API CALLED with: "${query}"`, 'debounced');
}, 500);

document.getElementById('debounce-input').addEventListener('input', (e) => {
  debounceRaw++;
  document.getElementById('debounce-raw').textContent = debounceRaw;
  addLog('debounce-log', `keystroke: "${e.target.value}"`, 'raw');
  debouncedSearch(e.target.value);
});

// Throttle demo
const throttledHandler = throttle(() => {
  throttleFired++;
  document.getElementById('throttle-fired').textContent = throttleFired;
  addLog('throttle-log', `✅ HANDLER FIRED (${throttleFired})`, 'throttled');
}, 300);

document.getElementById('throttle-btn').addEventListener('click', () => {
  throttleRaw++;
  document.getElementById('throttle-raw').textContent = throttleRaw;
  addLog('throttle-log', `click #${throttleRaw}`, 'raw');
  throttledHandler();
});
</script>
</body>
</html>
