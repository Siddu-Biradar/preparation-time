      --warning: #7a3a12; --warning-soft: #f7e7dd; --code: #f3efe7;
      --green: #27ae60; --green-soft: #e8f8f0; --green-border: #a3d9b1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 20px; }
    body { font-family: "Georgia", "Times New Roman", serif; color: var(--ink); background: var(--bg); line-height: 1.6; font-size: 11.4pt; }
    main { max-width: 960px; margin: 0 auto; background: var(--paper); padding: 28px 34px 44px; min-height: 100vh; }
    h1 { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 26pt; letter-spacing: -0.03em; margin-bottom: 6px; color: #1a2530; line-height: 1.2; }
    .subtitle { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--muted); font-size: 11.2pt; margin-bottom: 16px; }

    /* Stats Bar */
    .stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; padding: 14px 18px; background: linear-gradient(135deg, #f9f6f0 0%, #edf3f7 100%); border: 1px solid var(--line); border-radius: 12px; align-items: center; }
    .stat { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 10.4pt; color: var(--muted); }
    .stat strong { color: var(--accent); font-size: 16pt; }
    .stat.completed strong { color: var(--green); }
    .progress-bar-outer { flex: 1; min-width: 200px; height: 18px; background: #e8e4dc; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .progress-bar-inner { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); border-radius: 10px; transition: width 0.4s ease; min-width: 0; }
    .progress-text { font-family: "Avenir Next", sans-serif; font-size: 10pt; font-weight: 700; color: var(--green); min-width: 45px; text-align: right; }

    /* Controls */
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .controls button { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9.6pt; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; transition: all 0.2s; }
    .controls button:hover { background: var(--accent-soft); border-color: #b3d4e8; }
    .controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .controls .reset-btn { margin-left: auto; background: var(--warning-soft); border-color: #e0c4ad; color: var(--warning); font-weight: 600; }
    .controls .reset-btn:hover { background: #f0d4c0; }

    /* Phase Card */
    .phase-card { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; transition: box-shadow 0.2s; }
    .phase-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .phase-header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: linear-gradient(135deg, #f9f6f0 0%, #edf3f7 100%); cursor: pointer; user-select: none; border-bottom: 1px solid var(--line); }
    .phase-header:hover { background: linear-gradient(135deg, #f0ede4 0%, #e4ecf2 100%); }
    .phase-toggle { font-size: 11pt; color: var(--muted); transition: transform 0.2s; width: 18px; flex-shrink: 0; }
    .phase-card.collapsed .phase-toggle { transform: rotate(-90deg); }
    .phase-card.collapsed .phase-body { display: none; }
    .phase-title { font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13pt; font-weight: 700; color: #1a2530; flex: 1; }
    .phase-progress { font-family: "Avenir Next", sans-serif; font-size: 9.4pt; color: var(--muted); white-space: nowrap; }
    .phase-progress .done { color: var(--green); font-weight: 700; }
    .phase-bar { width: 80px; height: 6px; background: #e8e4dc; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
    .phase-bar-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.3s; }
    .phase-badge { font-family: "Avenir Next", sans-serif; font-size: 8.6pt; padding: 3px 10px; border-radius: 999px; font-weight: 700; flex-shrink: 0; }
    .phase-badge.complete { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }
    .phase-badge.in-progress { background: #fef9f0; color: #b8860b; border: 1px solid #f0dcc0; }
    .phase-badge.not-started { background: #f5f3ef; color: var(--muted); border: 1px solid var(--line); }

    .phase-body { padding: 6px 0; }
    .section-item { display: flex; align-items: center; gap: 10px; padding: 9px 18px; transition: background 0.15s; }
    .section-item:hover { background: #f9f7f3; }
    .section-item.checked { background: var(--green-soft); }
    .section-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
    .section-item label { cursor: pointer; font-size: 10.8pt; flex: 1; }
    .section-item.checked label { color: var(--green); text-decoration: line-through; text-decoration-color: #a3d9b1; }
    .section-item .section-link { font-size: 9pt; color: var(--accent); text-decoration: none; font-family: "Avenir Next", sans-serif; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
    .section-item:hover .section-link { opacity: 1; }

    /* Responsive */
    @media (max-width: 600px) {
      main { padding: 16px 14px 30px; }
      .stats-bar { flex-direction: column; gap: 10px; }
      .phase-header { padding: 12px 14px; }
      .section-item { padding: 8px 14px; }
      .phase-bar { width: 60px; }

// ─── State ───
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function getKey(phaseId, sectionIdx) { return `${phaseId}__${sectionIdx}`; }

let state = loadState();
let currentFilter = 'all';

// ─── Render ───
function render() {
  const container = document.getElementById('tracker');
  container.innerHTML = '';
  let totalSections = 0, doneSections = 0;

  phases.forEach(phase => {
    const card = document.createElement('div');
    card.className = 'phase-card';
    card.dataset.phaseId = phase.id;

    let phaseDone = 0;
    phase.sections.forEach((_, i) => {
      totalSections++;
      if (state[getKey(phase.id, i)]) { doneSections++; phaseDone++; }
    });

    const phasePct = phase.sections.length ? Math.round((phaseDone / phase.sections.length) * 100) : 0;
    const badgeClass = phasePct === 100 ? 'complete' : phasePct > 0 ? 'in-progress' : 'not-started';
    const badgeText = phasePct === 100 ? '✓ Done' : phasePct > 0 ? `${phasePct}%` : 'Not Started';

    // Filter logic
    if (currentFilter === 'completed' && phasePct < 100) { card.style.display = 'none'; }
    if (currentFilter === 'pending' && phasePct === 100) { card.style.display = 'none'; }

    card.innerHTML = `
      <div class="phase-header">
        <span class="phase-toggle">▼</span>
        <span class="phase-title">${phase.title}</span>
        <span class="phase-progress"><span class="done">${phaseDone}</span>/${phase.sections.length}</span>
        <div class="phase-bar"><div class="phase-bar-fill" style="width:${phasePct}%"></div></div>
        <span class="phase-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="phase-body">
        ${phase.sections.map((sec, i) => {
          const key = getKey(phase.id, i);
          const checked = state[key] ? 'checked' : '';
          const checkedClass = state[key] ? 'checked' : '';
          return `<div class="section-item ${checkedClass}">
            <input type="checkbox" id="${key}" ${checked} data-phase="${phase.id}" data-idx="${i}">
            <label for="${key}">${sec}</label>
            <a href="${phase.file}" class="section-link" target="_blank">Open ↗</a>
          </div>`;
        }).join('')}
      </div>
    `;
    container.appendChild(card);

    // Toggle collapse
    card.querySelector('.phase-header').addEventListener('click', () => {
      card.classList.toggle('collapsed');
    });
  });

  // Checkbox listeners
  container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', e => {
      const key = getKey(e.target.dataset.phase, e.target.dataset.idx);
      if (e.target.checked) state[key] = true;
      else delete state[key];
      saveState(state);
      render();
    });
  });

  // Stats
  const pct = totalSections ? Math.round((doneSections / totalSections) * 100) : 0;
  document.getElementById('totalCount').textContent = totalSections;
  document.getElementById('doneCount').textContent = doneSections;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
}

// ─── Controls ───
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;
    if (filter === 'collapse-all') {
      document.querySelectorAll('.phase-card').forEach(c => c.classList.add('collapsed'));
      return;
    }
    if (filter === 'expand-all') {
      document.querySelectorAll('.phase-card').forEach(c => c.classList.remove('collapsed'));
      return;
    }
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = filter;
    render();
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset ALL progress? This cannot be undone.')) {
    state = {};
    saveState(state);
    render();
  }
});

// Initial render
render();
</script>
<script src="nav.js"></script>
</body>
</html>
